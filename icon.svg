<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- クレーン生活のアイコン（オリジナル）：赤い板の上の銀の「？」フックに、ボールチェーンで吊った銀のリングが掛かる。
       PNG（icon-180/192/512）はこの SVG をブラウザで描き出したもの。直す時はこれを直して描き直す -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#4a2391"/>
      <stop offset="0.55" stop-color="#22114a"/>
      <stop offset="1" stop-color="#0d0a1c"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b47"/>
      <stop offset="1" stop-color="#c3121f"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d9dee6"/>
      <stop offset="0.6" stop-color="#8e98a8"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="silverV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#a7b0be"/>
      <stop offset="1" stop-color="#e3e8ef"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ネオンの輪（奥） -->
  <circle cx="256" cy="230" r="178" fill="none" stroke="#ff4fa3" stroke-width="10" opacity="0.55" filter="url(#glow)"/>
  <circle cx="256" cy="230" r="178" fill="none" stroke="#ff8fd0" stroke-width="3" opacity="0.7"/>

  <!-- 赤い板（手前に寝かせた看板）と黄色の爆発 -->
  <g filter="url(#shadow)">
    <path d="M70 372 L442 372 L480 470 L32 470 Z" fill="url(#plate)"/>
    <path d="M70 372 L442 372 L446 382 L66 382 Z" fill="#ff7a83" opacity="0.7"/>
  </g>
  <path d="M256 384 l22 22 30 -12 -2 30 30 10 -26 18 16 26 -32 -2 -8 30 -22 -22 -22 22 -8 -30 -32 2 16 -26 -26 -18 30 -10 -2 -30 30 12 z"
        fill="#ffd400"/>
  <path d="M256 404 l14 14 19 -7 -1 19 19 6 -16 12 10 16 -20 -1 -5 19 -14 -14 -14 14 -5 -19 -20 1 10 -16 -16 -12 19 -6 -1 -19 19 7 z"
        fill="#fff36b"/>

  <!-- ボールチェーン -->
  <rect x="254" y="0" width="4" height="98" fill="#9aa3ad"/>
  <g fill="url(#silverV)" stroke="#6b7484" stroke-width="1.5">
    <circle cx="256" cy="10" r="7"/><circle cx="256" cy="28" r="7"/><circle cx="256" cy="46" r="7"/>
    <circle cx="256" cy="64" r="7"/><circle cx="256" cy="82" r="7"/>
  </g>

  <!-- 銀のリング（斜めから見た輪）。先に全部描き、フックの後ろを通る -->
  <g filter="url(#shadow)">
    <ellipse cx="256" cy="180" rx="36" ry="80" fill="none" stroke="#5f6877" stroke-width="24"/>
    <ellipse cx="256" cy="180" rx="36" ry="80" fill="none" stroke="url(#silver)" stroke-width="18"/>
  </g>

  <!-- 「？」のフック：板に立つ柱 → 輪の一番下から背中側を回って上を越え、口の側を下る（先に玉） -->
  <g filter="url(#shadow)">
    <ellipse cx="256" cy="444" rx="36" ry="9" fill="#9aa3ad"/>
    <rect x="242" y="414" width="28" height="26" rx="3" fill="url(#silverV)" stroke="#5f6877" stroke-width="2"/>
    <path d="M256 418 L256 372 A72 72 0 1 1 328 300" fill="none" stroke="#5f6877" stroke-width="24" stroke-linecap="round"/>
    <path d="M256 418 L256 372 A72 72 0 1 1 328 300" fill="none" stroke="url(#silver)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="328" cy="304" r="16" fill="url(#silver)" stroke="#5f6877" stroke-width="3"/>
  </g>

  <!-- リングの手前側の線は、フックの輪のてっぺんの前を通る（くぐって掛かって見えるように） -->
  <path d="M238 249.3 A36 80 0 0 1 221.2 200.7" fill="none" stroke="#5f6877" stroke-width="24" stroke-linecap="butt"/>
  <path d="M238 249.3 A36 80 0 0 1 221.2 200.7" fill="none" stroke="url(#silver)" stroke-width="18" stroke-linecap="butt"/>
  <!-- つや -->
  <path d="M233 130 A30 70 0 0 1 262 104" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M206 262 A66 66 0 0 1 222 240" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- リングの付け根（チェーンとつなぐ金具） -->
  <rect x="246" y="90" width="20" height="16" rx="6" fill="url(#silverV)" stroke="#5f6877" stroke-width="3"/>
</svg>
